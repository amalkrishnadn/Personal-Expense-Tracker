<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background gradient: forest green -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E4D40"/>
      <stop offset="100%" stop-color="#112E26"/>
    </linearGradient>
    <!-- Accent gradient: brass to orange -->
    <linearGradient id="accent" x1="12" y1="16" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4A96A"/>
      <stop offset="100%" stop-color="#D56A43"/>
    </linearGradient>
    <!-- Subtle inner glow -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#B89B62" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle top-left highlight -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" opacity="0.5"/>
  <ellipse cx="10" cy="10" rx="22" ry="18" fill="#2A6351" opacity="0.25"/>

  <!-- Coin ring decoration (thin circle) -->
  <circle cx="32" cy="32" r="22" stroke="url(#accent)" stroke-width="1.2" opacity="0.3" fill="none"/>

  <!-- Stylised "M" lettermark using the accent gradient -->
  <path
    d="M16 44 L16 22 L24 22 L32 36 L40 22 L48 22 L48 44 L43 44 L43 28.5 L35 43 L29 43 L21 28.5 L21 44 Z"
    fill="url(#accent)"
    filter="url(#glow)"
  />

  <!-- Small coin accent dot under the M -->
  <circle cx="32" cy="49" r="2" fill="url(#accent)" opacity="0.6"/>
</svg>